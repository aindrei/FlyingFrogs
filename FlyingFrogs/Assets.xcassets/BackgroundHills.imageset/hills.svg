    <!-- Tree 1 -->
    <ellipse cx="100" cy="165" rx="12" ry="18"/>
    <ellipse cx="108" cy="160" rx="10" ry="15"/>

    <!-- Tree 2 -->
    <ellipse cx="250" cy="155" rx="14" ry="20"/>
    <ellipse cx="260" cy="150" rx="11" ry="16"/>

    <!-- Tree 3 -->
    <ellipse cx="420" cy="145" rx="13" ry="19"/>
    <ellipse cx="410" cy="150" rx="10" ry="14"/>

    <!-- Tree 4 -->
