<svg xmlns="http://www.w3.org/2000/svg" width="70" height="400" viewBox="0 0 70 400">
  <!-- Main pipe body -->
  <rect x="5" y="0" width="60" height="360" fill="#43A047"/>
  <rect x="10" y="0" width="15" height="360" fill="#66BB6A"/>
  <rect x="50" y="0" width="10" height="360" fill="#2E7D32"/>

  <!-- Pipe cap (lip at top for bottom obstacle) -->
  <rect x="0" y="355" width="70" height="45" rx="4" fill="#43A047"/>
  <rect x="0" y="360" width="70" height="40" rx="4" fill="#4CAF50"/>
  <rect x="5" y="365" width="18" height="30" rx="2" fill="#66BB6A"/>
  <rect x="55" y="365" width="10" height="30" rx="2" fill="#388E3C"/>

  <!-- Highlights -->
  <rect x="8" y="5" width="8" height="350" fill="#81C784" opacity="0.5"/>
</svg>
