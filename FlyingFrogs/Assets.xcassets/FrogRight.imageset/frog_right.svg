<svg xmlns="http://www.w3.org/2000/svg" width="80" height="60" viewBox="0 0 80 60">
  <!-- Body (slightly shifted left to make room for head on right) -->
  <ellipse cx="35" cy="35" rx="28" ry="20" fill="#4CAF50"/>
  <ellipse cx="35" cy="38" rx="22" ry="14" fill="#81C784"/>

  <!-- Head/snout extending right -->
  <ellipse cx="50" cy="25" rx="22" ry="16" fill="#4CAF50"/>
  <ellipse cx="55" cy="28" rx="12" ry="10" fill="#81C784"/>

  <!-- Nose/snout tip -->
  <ellipse cx="68" cy="28" rx="8" ry="6" fill="#4CAF50"/>

  <!-- Nostrils -->
  <circle cx="72" cy="26" r="2" fill="#2E7D32"/>
  <circle cx="72" cy="30" r="2" fill="#2E7D32"/>

  <!-- Eyes (on top, looking right) -->
  <circle cx="45" cy="12" r="10" fill="#4CAF50"/>
  <circle cx="58" cy="14" r="9" fill="#4CAF50"/>
  <circle cx="45" cy="11" r="7" fill="white"/>
  <circle cx="58" cy="13" r="6" fill="white"/>
  <!-- Pupils looking right -->
  <circle cx="48" cy="11" r="4" fill="#1a1a1a"/>
  <circle cx="61" cy="13" r="3.5" fill="#1a1a1a"/>
  <!-- Eye highlights -->
  <circle cx="49" cy="9" r="1.5" fill="white"/>
  <circle cx="62" cy="11" r="1.2" fill="white"/>

  <!-- Mouth -->
  <path d="M 58 35 Q 65 38 70 35" stroke="#2E7D32" stroke-width="2" fill="none"/>

  <!-- Cheek -->
  <ellipse cx="62" cy="32" rx="4" ry="3" fill="#F48FB1" opacity="0.5"/>

  <!-- Back leg -->
  <ellipse cx="12" cy="45" rx="10" ry="8" fill="#388E3C"/>

  <!-- Front legs -->
  <ellipse cx="25" cy="52" rx="7" ry="5" fill="#388E3C"/>
  <ellipse cx="50" cy="50" rx="6" ry="4" fill="#388E3C"/>
</svg>
