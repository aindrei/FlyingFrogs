<svg xmlns="http://www.w3.org/2000/svg" width="100" height="60" viewBox="0 0 100 60">
  <!-- Main ground color -->
  <rect width="100" height="60" fill="#5D4037"/>

  <!-- Top grass layer -->
  <rect width="100" height="12" fill="#7CB342"/>

  <!-- Grass highlights -->
  <rect y="2" width="100" height="4" fill="#8BC34A"/>

  <!-- Grass blades -->
  <g fill="#9CCC65">
    <path d="M5 12 L7 6 L9 12"/>
    <path d="M20 12 L22 5 L24 12"/>
    <path d="M35 12 L37 7 L39 12"/>
    <path d="M50 12 L52 4 L54 12"/>
    <path d="M65 12 L67 6 L69 12"/>
    <path d="M80 12 L82 5 L84 12"/>
    <path d="M95 12 L97 7 L99 12"/>
  </g>

  <!-- Dirt texture dots -->
  <g fill="#4E342E" opacity="0.5">
    <circle cx="15" cy="30" r="3"/>
    <circle cx="45" cy="40" r="2"/>
    <circle cx="70" cy="25" r="2.5"/>
    <circle cx="85" cy="45" r="2"/>
    <circle cx="30" cy="50" r="1.5"/>
    <circle cx="60" cy="35" r="2"/>
  </g>

  <!-- Lighter dirt patches -->
  <g fill="#6D4C41" opacity="0.4">
    <ellipse cx="25" cy="35" rx="8" ry="4"/>
    <ellipse cx="75" cy="50" rx="10" ry="5"/>
  </g>
</svg>
